<!-- Supabase → Authentication → Emails → Magic Link (and the same body for "Confirm signup").
     Subject: Σύνδεση στην τάξη -->
<div style="font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1a2238">
  <p style="font-size: 22px; font-weight: 800; color: #1e3a8a; margin: 0 0 16px">τάξη</p>
  <p style="font-size: 16px; margin: 0 0 20px">Πάτα το κουμπί για να μπεις. Ο σύνδεσμος ισχύει για 1 ώρα.</p>
  <p style="margin: 0 0 24px">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #1e3a8a; color: #ffffff; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 8px">Είσοδος στην τάξη</a>
  </p>
  <p style="font-size: 14px; color: #66746c; margin: 0 0 6px">Ή γράψε αυτόν τον κωδικό στην εφαρμογή:</p>
  <p style="font-size: 28px; font-weight: 800; letter-spacing: 6px; margin: 0 0 24px">{{ .Token }}</p>
  <p style="font-size: 12px; color: #66746c; margin: 0">Αν δεν ζήτησες εσύ να συνδεθείς, αγνόησε αυτό το μήνυμα.</p>
</div>
