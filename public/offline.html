<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Χωρίς σύνδεση · τάξη</title>
    <style>
      :root { color-scheme: light; --bg: #f6f4ee; --ink: #1a2238; --muted: #676c80; --brand: #1e3a8a; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
      h1 { font-size: 22px; margin: 16px 0 6px; }
      p { color: var(--muted); margin: 0 0 20px; max-width: 320px; }
      button { height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font-weight: 600; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1a2238"/><path d="M17 22.5h28" stroke="#f6f4ee" stroke-width="5.5" stroke-linecap="round"/><path d="M30 23v15.5a8.5 8.5 0 0 0 8.5 8.5" fill="none" stroke="#f6f4ee" stroke-width="5.5" stroke-linecap="round"/><circle cx="47.5" cy="46.5" r="4.25" fill="#e5484d"/></svg>
      <h1>Δεν υπάρχει σύνδεση</h1>
      <p>Η «τάξη» χρειάζεται διαδίκτυο για να φέρει τα δεδομένα σου. Μόλις επανέλθει η σύνδεση, συνεχίζεις από εκεί που ήσουν.</p>
      <button type="button" onclick="location.reload()">Ξαναδοκίμασε</button>
    </main>
  </body>
</html>
